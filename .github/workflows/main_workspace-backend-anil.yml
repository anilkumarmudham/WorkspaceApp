name: Build and deploy Node.js app to Azure Web App - workspace-backend-anil

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Build Project
        working-directory: ./backend
        run: npm run build --if-present

      - name: Run Tests
        working-directory: ./backend
        run: npm test --if-present

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D77EB403DF8C4C279C69AD937DF69DAC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B56D00F30B7148AA9A71A13953C2D6CB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_13FC26A183FD4EB69160A5DA613F1E6B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: workspace-backend-anil
          slot-name: Production
          package: .
